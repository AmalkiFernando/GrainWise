<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Classify a rice grain as Cammeo or Osmancik from its shape." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>GrainWise</title>
    <script>
      // Resolve and paint the theme before first paint, so dark-mode users don't see one light
      // frame before the swap. Kept inline and dependency-free; mirrors src/lib/themeStorage.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('grainwise.theme')
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : preference === 'dark'
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          // Private mode, disabled storage, or no matchMedia: fall through to the light default.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
